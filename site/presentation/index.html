<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H3L Design System Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #080C14; }
    #root { width: 100vw; height: 100vh; }
    button { font-family: 'Plus Jakarta Sans', sans-serif; }
    :fullscreen { width: 100vw; height: 100vh; }
    :-webkit-full-screen { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── Easing ────────────────────────────────────────────────
const E = {
  smooth:     t => t*t*(3-2*t),
  outCubic:   t => 1 - Math.pow(1-t, 3),
  inOutCubic: t => t<0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2,
  outBack:    t => { const c=1.70158+1; return 1+c*Math.pow(t-1,3)+(c-1)*Math.pow(t-1,2); },
  outQuart:   t => 1 - Math.pow(1-t, 4),
};

function c01(v) { return Math.max(0, Math.min(1, v)); }
function ip(t, [i0,i1], [o0,o1], ease=E.smooth) {
  const p = c01((t-i0)/(i1-i0));
  return o0 + (o1-o0)*ease(p);
}

// ── Palette ───────────────────────────────────────────────
const C = {
  bg:      '#080C14',
  surf:    '#0D1626',
  surf2:   '#111D30',
  blue:    '#4F8EF7',
  teal:    '#22D3A5',
  gold:    '#F0A030',
  text:    '#F0F4FF',
  muted:   '#7A90B8',
  dim:     '#2E4060',
  border:  'rgba(79,142,247,0.14)',
};

const W = 1440, H = 810;
const SLIDE_COUNT = 10;
const TRANS_DUR = 0.55;

// ── Stage ─────────────────────────────────────────────────
function Stage({ children }) {
  const [scale, setScale] = useState(1);
  useEffect(() => {
    const calc = () => setScale(Math.min(window.innerWidth/W, window.innerHeight/H));
    calc();
    window.addEventListener('resize', calc);
    return () => window.removeEventListener('resize', calc);
  }, []);
  return (
    <div style={{ position:'fixed', inset:0, background:C.bg, display:'flex', alignItems:'center', justifyContent:'center', overflow:'hidden' }}>
      <div style={{ width:W, height:H, transform:`scale(${scale})`, transformOrigin:'center', position:'relative', overflow:'hidden' }}>
        {children}
      </div>
    </div>
  );
}

// ── Shared BG glow ────────────────────────────────────────
function Glow({ id, cx='50%', cy='50%', r='50%', color, opacity=0.1 }) {
  return (
    <svg style={{ position:'absolute', inset:0, pointerEvents:'none' }} width={W} height={H}>
      <defs>
        <radialGradient id={id} cx={cx} cy={cy} r={r}>
          <stop offset="0%" stopColor={color} stopOpacity={opacity}/>
          <stop offset="100%" stopColor={C.bg} stopOpacity={0}/>
        </radialGradient>
      </defs>
      <rect width={W} height={H} fill={`url(#${id})`}/>
    </svg>
  );
}

// ── Typing cursor line ────────────────────────────────────
function TypeLine({ text, t, delay=0, style={} }) {
  const p = ip(t, [delay, delay+0.6], [0,1], E.outCubic);
  const chars = Math.floor(p * text.length);
  return (
    <span style={{ fontFamily:"'JetBrains Mono',monospace", ...style }}>
      {text.slice(0,chars)}{p<1 && <span style={{ opacity: Math.sin(t*8)*0.5+0.5, color:C.blue }}>▌</span>}
    </span>
  );
}

// ── Counter ───────────────────────────────────────────────
function Counter({ value, t, delay=0, suffix='' }) {
  const p = c01(ip(t,[delay,delay+1.4],[0,1],E.outCubic));
  return <>{Math.round(p*value).toLocaleString()}{suffix}</>;
}

// ── Grid lines decoration ─────────────────────────────────
function GridBg({ opacity=0.4 }) {
  const lines = [];
  for (let i=1;i<8;i++) {
    lines.push(<line key={`h${i}`} x1={0} y1={i*H/8} x2={W} y2={i*H/8} stroke={C.border} strokeWidth={0.5} opacity={opacity}/>);
    lines.push(<line key={`v${i}`} x1={i*W/8} y1={0} x2={i*W/8} y2={H} stroke={C.border} strokeWidth={0.5} opacity={opacity}/>);
  }
  return (
    <svg style={{ position:'absolute', inset:0, pointerEvents:'none' }} width={W} height={H}>
      {lines}
    </svg>
  );
}

// ── Pill badge ────────────────────────────────────────────
function Label({ children, color=C.blue }) {
  return (
    <div style={{ display:'inline-flex', alignItems:'center', gap:6, marginBottom:18 }}>
      <div style={{ width:6, height:6, borderRadius:'50%', background:color }}/>
      <span style={{ fontSize:12, fontWeight:700, letterSpacing:'0.18em', color, textTransform:'uppercase' }}>{children}</span>
    </div>
  );
}

// ─────────────────────────────────────────────────────────
// SLIDE 1 — HERO
// ─────────────────────────────────────────────────────────
function Slide1({ t }) {
  const g = c01(Math.sin(t*0.6)*0.5+0.5);
  const hP  = ip(t,[0.3,1.1],[0,1],E.outCubic);
  const h2P = ip(t,[0.8,1.6],[0,1],E.outCubic);
  const divP= ip(t,[1.3,1.8],[0,1],E.outCubic);
  const tagP= ip(t,[1.5,2.2],[0,1],E.outCubic);
  const stP = ip(t,[2.0,2.8],[0,1],E.outCubic);

  return (
    <div style={{ width:W, height:H, background:C.bg, position:'relative', overflow:'hidden' }}>
      <GridBg opacity={0.35}/>
      <Glow id="g1" cx="50%" cy="40%" r="55%" color={C.blue} opacity={0.09+0.05*g}/>
      <svg style={{ position:'absolute', inset:0, pointerEvents:'none' }} width={W} height={H}>
        <line x1={W*(1-hP)*0.5} y1={H-2} x2={W*(1-(1-hP)*0.5)} y2={H-2} stroke={`url(#accentLine)`} strokeWidth={2}/>
        <defs>
          <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stopColor="transparent"/>
            <stop offset="50%" stopColor={C.blue}/>
            <stop offset="100%" stopColor="transparent"/>
          </linearGradient>
          <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stopColor={C.blue}/>
            <stop offset="100%" stopColor={C.teal}/>
          </linearGradient>
        </defs>
      </svg>

      <div style={{ position:'absolute', inset:0, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center' }}>
        <div style={{ opacity:hP, transform:`translateY(${ip(t,[0.3,1.1],[24,0],E.outCubic)}px)`, fontSize:12, fontWeight:700, letterSpacing:'0.22em', color:C.blue, textTransform:'uppercase', marginBottom:20 }}>
          Unilever Internal Products
        </div>

        <div style={{ opacity:hP, transform:`translateY(${ip(t,[0.3,1.1],[30,0],E.outCubic)}px)`, fontSize:112, fontWeight:900, color:C.text, lineHeight:1, letterSpacing:'-0.04em', textAlign:'center' }}>
          H3L
        </div>
        <div style={{ opacity:h2P, transform:`translateY(${ip(t,[0.8,1.6],[22,0],E.outCubic)}px)`, fontSize:112, fontWeight:900, lineHeight:1, letterSpacing:'-0.04em', textAlign:'center', background:'linear-gradient(135deg, #4F8EF7, #22D3A5)', WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent' }}>
          Design System Library
        </div>

        <div style={{ width:500*divP, height:1.5, background:'linear-gradient(90deg, transparent, #4F8EF7, #22D3A5, transparent)', margin:'30px 0' }}/>

        <div style={{ opacity:tagP, transform:`translateY(${ip(t,[1.5,2.2],[14,0],E.outCubic)}px)`, fontSize:24, fontWeight:400, color:C.muted, letterSpacing:'0.06em', textAlign:'center' }}>
          One library.&nbsp;&nbsp;&nbsp;Any engineer.&nbsp;&nbsp;&nbsp;Every product.
        </div>

        <div style={{ opacity:stP, display:'flex', gap:60, marginTop:52 }}>
          {[['224','Components'],['194','Live Implementations'],['100','Readiness Score']].map(([n,l])=>(
            <div key={l} style={{ textAlign:'center' }}>
              <div style={{ fontSize:40, fontWeight:900, color:C.text }}>{n}</div>
              <div style={{ fontSize:12, color:C.muted, letterSpacing:'0.12em', textTransform:'uppercase', marginTop:5 }}>{l}</div>
            </div>
          ))}
        </div>
      </div>

      <div style={{ position:'absolute', bottom:28, right:40, opacity:stP, fontSize:12, color:C.dim, letterSpacing:'0.14em' }}>
        MVP Complete · 2025
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────
// SLIDE 2 — THE PROBLEM
// ─────────────────────────────────────────────────────────

    { icon:'⚠', color:C.gold,  title:'Inconsistency', body:'Every team builds the same button, the same modal, the same table — slightly differently. The product feels fragmented.' },
    { icon:'⧉', color:C.blue,  title:'Duplication',    body:'Engineers rebuild components that already exist somewhere else. Velocity drops. Deadlines slip. Morale fades.' },
    { icon:'↯', color:'#E05555', title:'Drift',         body:'Design changes in Figma. Code never catches up. QA flags regressions. Users notice. Trust erodes.' },
  ];
  return (
    <div style={{ width:W, height:H, background:C.bg, position:'relative', overflow:'hidden' }}>
      <Glow id="g2" cx="10%" cy="30%" r="40%" color={C.gold} opacity={0.07}/>
      <div style={{ position:'absolute', inset:0, padding:'64px 96px' }}>
        <div style={{ opacity:hP }}><Label color={C.gold}>The Challenge</Label></div>
        <div style={{ opacity:hP, transform:`translateX(${ip(t,[0.2,0.9],[-28,0],E.outCubic)}px)`, fontSize:58, fontWeight:900, color:C.text, lineHeight:1.08, letterSpacing:'-0.025em', marginBottom:56 }}>
          Building the same thing.<br/><span style={{ color:C.gold }}>Over and over again.</span>
        </div>
        <div style={{ display:'flex', gap:24 }}>
          {probs.map(({ icon, color, title, body }, i) => {
            const p = ip(t,[0.6+i*0.35,1.2+i*0.35],[0,1],E.outCubic);
            return (
              <div key={title} style={{ flex:1, opacity:p, transform:`translateY(${ip(t,[0.6+i*0.35,1.2+i*0.35],[36,0],E.outCubic)}px)`, background:C.surf, border:`1px solid ${color}22`, borderRadius:18, padding:'36px 30px' }}>
                <div style={{ fontSize:34, marginBottom:14 }}>{icon}</div>
                <div style={{ fontSize:21, fontWeight:800, color, marginBottom:12 }}>{title}</div>
                <div style={{ fontSize:15.5, color:C.muted, lineHeight:1.65 }}>{body}</div>
              </div>
            );
          })}
        </div>
        <div style={{ opacity:ip(t,[2.1,2.7],[0,1],E.outCubic), marginTop:44, textAlign:'center', fontSize:19, color:C.muted, fontStyle:'italic' }}>
          There had to be a better way.
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────

  const hP = ip(t,[0.2,0.9],[0,1],E.outCubic);

  return (
    <div style={{ width:W, height:H, background:C.bg, position:'relative', overflow:'hidden' }}>
      <Glow id="g3" cx="75%" cy="50%" r="50%" color={C.blue} opacity={0.10}/>
      {/* Left */}
      <div style={{ position:'absolute', left:96, top:0, bottom:0, width:540, display:'flex', flexDirection:'column', justifyContent:'center' }}>
        <div style={{ opacity:hP }}><Label color={C.blue}>The Solution</Label></div>
        <div style={{ opacity:hP, transform:`translateX(${ip(t,[0.2,0.9],[-28,0],E.outCubic)}px)`, fontSize:56, fontWeight:900, color:C.text, lineHeight:1.1, letterSpacing:'-0.025em', marginBottom:28 }}>
          One library.<br/><span style={{ background:'linear-gradient(135deg,#4F8EF7,#22D3A5)', WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent' }}>Built right.</span>
        </div>
        <div style={{ opacity:ip(t,[0.7,1.4],[0,1],E.outCubic), fontSize:17, color:C.muted, lineHeight:1.72, marginBottom:32 }}>
          A single shared source of truth for every UI component across Unilever's internal products — browsable, documented, and ready to drop into any project.
        </div>
        {[
          ['224 components ready to use', C.blue],
          ['Interactive live previews', C.teal],
          ['One-command copy to any project', C.gold],
          ['AI-readable manifest.json', C.blue],
        ].map(([label, color], i) => (
          <div key={label} style={{ opacity:ip(t,[1.0+i*0.15,1.5+i*0.15],[0,1],E.outCubic), transform:`translateX(${ip(t,[1.0+i*0.15,1.5+i*0.15],[-16,0],E.outCubic)}px)`, display:'flex', alignItems:'center', gap:12, marginBottom:14 }}>
            <div style={{ width:8, height:8, borderRadius:'50%', background:color, flexShrink:0 }}/>
            <span style={{ fontSize:16, color:C.text, fontWeight:500 }}>{label}</span>
          </div>
        ))}
      </div>
      {/* Right: component chip grid */}
      <div style={{ position:'absolute', right:56, top:60, bottom:60, width:660, display:'flex', flexWrap:'wrap', gap:10, alignContent:'flex-start', overflow:'hidden' }}>
        {chips.map((name,i) => {
          const p = ip(t,[0.5+i*0.038,0.9+i*0.038],[0,1],E.outBack);
          return (
            <div key={name} style={{ opacity:Math.min(1,p), transform:`scale(${Math.min(1,0.6+0.4*p)})`, background:C.surf, border:`1px solid ${C.border}`, borderRadius:10, padding:'9px 18px', fontSize:13.5, fontWeight:600, color:C.text }}>

// ─────────────────────────────────────────────────────────

// ─────────────────────────────────────────────────────────

  const hP = ip(t,[0.2,0.9],[0,1],E.outCubic);
  const stats = [
    { val:224, suf:'',  label:'Catalog Entries',        desc:'Components, patterns, and templates',                color:C.blue },

    { val:16,  suf:'',  label:'Screen Templates',       desc:'Full workspace screens for Nexus products',          color:C.gold },

        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:22 }}>
          {stats.map(({ val, suf, label, desc, color }, i) => {
            const p = ip(t,[0.4+i*0.18,1.0+i*0.18],[0,1],E.outCubic);

              <div key={label} style={{ opacity:p, transform:`translateY(${ip(t,[0.4+i*0.18,1.0+i*0.18],[28,0],E.outCubic)}px)`, background:C.surf, border:`1px solid ${color}20`, borderLeft:`3px solid ${color}`, borderRadius:16, padding:'28px 32px', display:'flex', alignItems:'center', gap:28 }}>
                <div style={{ fontSize:68, fontWeight:900, color, lineHeight:1, minWidth:150, fontVariantNumeric:'tabular-nums' }}>
                  <Counter value={val} t={t} delay={0.4+i*0.18} suffix={suf}/>

                  <div style={{ fontSize:19, fontWeight:700, color:C.text, marginBottom:6 }}>{label}</div>

}

        <div style={{ opacity:hP, transform:`translateX(${ip(t,[0.2,0.9],[-28,0],E.outCubic)}px)`, fontSize:56, fontWeight:900, color:C.text, lineHeight:1.1, letterSpacing:'-0.025em', marginBottom:52 }}>

                <div style={{ background:'#050A12', borderRadius:8, padding:'9px 14px', fontFamily:"'JetBrains Mono',monospace", fontSize:12.5, color:'#7AAEEE', wordBreak:'break-all', lineHeight:1.55 }}>{code}</div>

// ─────────────────────────────────────────────────────────
// SLIDE REGISTRY
// ─────────────────────────────────────────────────────────
const SLIDES = [Slide1,Slide2,Slide3,Slide4,Slide5,Slide6,Slide7,Slide8,Slide9,Slide10];

// ─────────────────────────────────────────────────────────
// APP
// ─────────────────────────────────────────────────────────
function App() {
  const [active, setActive]       = useState(0);
  const [prev, setPrev]           = useState(null);
  const [transP, setTransP]       = useState(1);
  const [slideT, setSlideT]       = useState(0);
  const [showUI, setShowUI]       = useState(true);
  const [fullscreen, setFullscreen] = useState(false);
  const [auto, setAuto]           = useState(false);

  const raf      = useRef(null);
  const lastTs   = useRef(null);
  const transRef = useRef(1);
  const slideTR  = useRef(0);
  const activeR  = useRef(0);
  const autoR    = useRef(false);
  const transitioning = useRef(false);
  const uiTimer  = useRef(null);

  const AUTO_SECS = 9;

  useEffect(() => {
    const loop = ts => {
      const dt = lastTs.current ? Math.min((ts - lastTs.current)/1000, 0.1) : 0;
      lastTs.current = ts;

      if (transRef.current < 1) {
        transRef.current = Math.min(1, transRef.current + dt/TRANS_DUR);
        setTransP(transRef.current);
        if (transRef.current >= 1) { setPrev(null); transitioning.current = false; }
      }

      slideTR.current += dt;
      setSlideT(slideTR.current);

      if (autoR.current && slideTR.current > AUTO_SECS && !transitioning.current) {
        if (activeR.current < SLIDE_COUNT - 1) go(activeR.current + 1);
        else { autoR.current = false; setAuto(false); }
      }

      raf.current = requestAnimationFrame(loop);
    };
    raf.current = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf.current);
  }, []);

  const go = useCallback(idx => {
    if (transitioning.current || idx < 0 || idx >= SLIDE_COUNT) return;
    transitioning.current = true;
    setPrev(activeR.current);
    activeR.current = idx;
    setActive(idx);
    transRef.current = 0;
    setTransP(0);
    slideTR.current = 0;
    setSlideT(0);
  }, []);

  useEffect(() => {
    const k = e => {
      if (e.key==='ArrowRight'||e.key===' '||e.key==='ArrowDown') { e.preventDefault(); go(activeR.current+1); }
      else if (e.key==='ArrowLeft'||e.key==='ArrowUp') { e.preventDefault(); go(activeR.current-1); }
      else if (e.key==='f'||e.key==='F') toggleFS();
      else if (e.key==='a'||e.key==='A') toggleAuto();
    };
    window.addEventListener('keydown', k);
    return () => window.removeEventListener('keydown', k);
  }, [go]);

  const toggleFS = useCallback(() => {
    if (!document.fullscreenElement) { document.documentElement.requestFullscreen?.(); setFullscreen(true); }
    else { document.exitFullscreen?.(); setFullscreen(false); }
  }, []);

  const toggleAuto = useCallback(() => {
    const n = !autoR.current;
    autoR.current = n;
    setAuto(n);
  }, []);

  useEffect(() => {
    const mv = () => {
      setShowUI(true);
      clearTimeout(uiTimer.current);
      uiTimer.current = setTimeout(() => setShowUI(false), 3200);
    };
    window.addEventListener('mousemove', mv);
    return () => window.removeEventListener('mousemove', mv);
  }, []);

  const entering = E.inOutCubic(c01(transP));
  const exiting  = 1 - entering;

  const ActiveComp = SLIDES[active];
  const PrevComp   = prev !== null ? SLIDES[prev] : null;

  return (
    <Stage>
      {PrevComp && (
        <div style={{ position:'absolute', inset:0, opacity:exiting, transform:`scale(${1-exiting*0.04})`, pointerEvents:'none' }}>
          <PrevComp t={slideTR.current}/>
        </div>
      )}
      <div style={{ position:'absolute', inset:0, opacity:entering, transform:`scale(${0.97+entering*0.03})` }}>
        <ActiveComp t={slideT}/>
      </div>

      {/* Dot nav */}
      <div style={{ position:'absolute', bottom:22, left:'50%', transform:'translateX(-50%)', display:'flex', gap:8, alignItems:'center', opacity:showUI?1:0, transition:'opacity 0.35s', zIndex:100 }}>
        {Array.from({length:SLIDE_COUNT},(_,i)=>(
          <div key={i} onClick={()=>go(i)} style={{ width:i===active?26:8, height:8, borderRadius:4, background:i===active?C.blue:C.dim, cursor:'pointer', transition:'all 0.3s' }}/>
        ))}
      </div>

      {/* Bottom-right controls */}
      <div style={{ position:'absolute', bottom:18, right:22, display:'flex', gap:8, alignItems:'center', opacity:showUI?1:0, transition:'opacity 0.35s', zIndex:100 }}>
        <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:12, color:C.dim }}>{active+1}/{SLIDE_COUNT}</span>
        <button onClick={toggleAuto} style={{ background:auto?`${C.blue}18`:'transparent', border:`1px solid ${auto?C.blue:C.dim}`, borderRadius:7, padding:'5px 11px', cursor:'pointer', color:auto?C.blue:C.dim, fontSize:12 }}>
          {auto?'⏸ Auto':'▶ Auto'}
        </button>
        <button onClick={toggleFS} style={{ background:'transparent', border:`1px solid ${C.dim}`, borderRadius:7, padding:'5px 11px', cursor:'pointer', color:C.dim, fontSize:12 }}>
          {fullscreen?'⛶ Exit':'⛶'}
        </button>
      </div>

      {/* Arrow nav */}
      {active>0 && (
        <div style={{ position:'absolute', left:14, top:'50%', transform:'translateY(-50%)', opacity:showUI?1:0, transition:'opacity 0.35s', zIndex:100 }}>
          <button onClick={()=>go(active-1)} style={{ background:`${C.surf}CC`, border:`1px solid ${C.border}`, borderRadius:'50%', width:42, height:42, cursor:'pointer', color:C.text, fontSize:20, display:'flex', alignItems:'center', justifyContent:'center' }}>‹</button>
        </div>
      )}
      {active<SLIDE_COUNT-1 && (
        <div style={{ position:'absolute', right:14, top:'50%', transform:'translateY(-50%)', opacity:showUI?1:0, transition:'opacity 0.35s', zIndex:100 }}>
          <button onClick={()=>go(active+1)} style={{ background:`${C.surf}CC`, border:`1px solid ${C.border}`, borderRadius:'50%', width:42, height:42, cursor:'pointer', color:C.text, fontSize:20, display:'flex', alignItems:'center', justifyContent:'center' }}>›</button>
        </div>
      )}

      {/* Keyboard hint — slide 1 only */}
      {active===0 && slideT>3.5 && (
        <div style={{ position:'absolute', bottom:58, left:'50%', transform:'translateX(-50%)', opacity:Math.min(1,(slideT-3.5)/0.5)*(showUI?1:0.4), fontSize:12, color:C.dim, letterSpacing:'0.16em', display:'flex', gap:14, zIndex:100 }}>
          <span>← → Navigate</span><span>·</span><span>F Fullscreen</span><span>·</span><span>A Auto-play</span>
        </div>
      )}
    </Stage>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
