<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H3L Design System Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #080C14; }
    #root { width: 100vw; height: 100vh; }
    button { font-family: 'Plus Jakarta Sans', sans-serif; }
    :fullscreen { width: 100vw; height: 100vh; }
    :-webkit-full-screen { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── Easing ─────────────────────────────────────────────────
const E = {
  smooth:     t => t*t*(3-2*t),
  outCubic:   t => 1 - Math.pow(1-t, 3),
  inOutCubic: t => t<0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2,
  outBack:    t => { const c=1.70158+1; return 1+c*Math.pow(t-1,3)+(c-1)*Math.pow(t-1,2); },
};

function c01(v) { return Math.max(0, Math.min(1, v)); }
function ip(t, [i0,i1], [o0,o1], ease=E.smooth) {
  return o0 + (o1-o0)*ease(c01((t-i0)/(i1-i0)));
}

// ── Palette ────────────────────────────────────────────────
const C = {
  bg:     '#080C14',
  surf:   '#0D1626',
  surf2:  '#111D30',
  blue:   '#4F8EF7',
  teal:   '#22D3A5',
  gold:   '#F0A030',
  text:   '#F0F4FF',
  muted:  '#7A90B8',
  dim:    '#2E4060',
  border: 'rgba(79,142,247,0.14)',
};

const W = 1440, H = 810;
const SLIDE_COUNT = 10;
const TRANS_DUR = 0.5;

// ── Stage ──────────────────────────────────────────────────
function Stage({ children }) {
  const [scale, setScale] = useState(1);
  useEffect(() => {
    const calc = () => setScale(Math.min(window.innerWidth/W, window.innerHeight/H));
    calc();
    window.addEventListener('resize', calc);
    return () => window.removeEventListener('resize', calc);
  }, []);
  return (
    <div style={{ position:'fixed', inset:0, background:C.bg, display:'flex', alignItems:'center', justifyContent:'center', overflow:'hidden' }}>
      <div style={{ width:W, height:H, transform:`scale(${scale})`, transformOrigin:'center', position:'relative', overflow:'hidden' }}>
        {children}
      </div>
    </div>
  );
}

// ── Glow ───────────────────────────────────────────────────
function Glow({ id, cx='50%', cy='50%', r='50%', color, op=0.1 }) {
  return (
    <svg style={{ position:'absolute', inset:0, pointerEvents:'none' }} width={W} height={H}>
      <defs>
        <radialGradient id={id} cx={cx} cy={cy} r={r}>
          <stop offset="0%" stopColor={color} stopOpacity={op}/>
          <stop offset="100%" stopColor={C.bg} stopOpacity={0}/>
        </radialGradient>
      </defs>
      <rect width={W} height={H} fill={`url(#${id})`}/>
    </svg>
  );
}

// ── Grid ───────────────────────────────────────────────────
function Grid({ op=0.35 }) {
  const lines = [];
  for (let i=1;i<8;i++) {
    lines.push(<line key={`h${i}`} x1={0} y1={i*H/8} x2={W} y2={i*H/8} stroke={C.border} strokeWidth={0.5} opacity={op}/>);
    lines.push(<line key={`v${i}`} x1={i*W/8} y1={0} x2={i*W/8} y2={H} stroke={C.border} strokeWidth={0.5} opacity={op}/>);
  }
  return <svg style={{ position:'absolute', inset:0, pointerEvents:'none' }} width={W} height={H}>{lines}</svg>;
}

// ── Label chip ─────────────────────────────────────────────
function Label({ children, color=C.blue }) {
  return (
    <div style={{ display:'inline-flex', alignItems:'center', gap:6, marginBottom:18 }}>
      <div style={{ width:6, height:6, borderRadius:'50%', background:color }}/>
      <span style={{ fontSize:12, fontWeight:700, letterSpacing:'0.18em', color, textTransform:'uppercase' }}>{children}</span>
    </div>
  );
}

// ── Typewriter ─────────────────────────────────────────────
function TypeLine({ text, t, delay=0, style={} }) {
  const p = ip(t, [delay, delay+0.7], [0,1], E.outCubic);
  const chars = Math.floor(p * text.length);
  return (
    <span style={{ fontFamily:"'JetBrains Mono',monospace", ...style }}>
      {text.slice(0,chars)}{p<1 && <span style={{ opacity:Math.sin(t*8)*0.5+0.5, color:C.teal }}>▌</span>}
    </span>
  );
}

// ── Step row ───────────────────────────────────────────────
function StepRow({ n, color, title, children, t, delay }) {
  const p = ip(t,[delay,delay+0.55],[0,1],E.outCubic);
  return (
    <div style={{ opacity:p, transform:`translateX(${ip(t,[delay,delay+0.55],[-24,0],E.outCubic)}px)`, display:'flex', alignItems:'flex-start', gap:20, background:C.surf, border:`1px solid ${C.border}`, borderRadius:14, padding:'20px 26px' }}>
      <div style={{ width:44, height:44, borderRadius:'50%', background:`${color}18`, border:`1.5px solid ${color}`, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, fontSize:17, fontWeight:900, color, marginTop:2 }}>{n}</div>
      <div style={{ flex:1 }}>
        <div style={{ fontSize:17, fontWeight:700, color:C.text, marginBottom:8 }}>{title}</div>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────
// SLIDE 1 — WELCOME
// ─────────────────────────────────────────────────────────
function Slide1({ t }) {
  const g    = c01(Math.sin(t*0.6)*0.5+0.5);
  const hP   = ip(t,[0.3,1.1],[0,1],E.outCubic);
  const h2P  = ip(t,[0.8,1.6],[0,1],E.outCubic);
  const divP = ip(t,[1.3,1.8],[0,1],E.smooth);
  const tagP = ip(t,[1.5,2.2],[0,1],E.outCubic);
  const stP  = ip(t,[2.0,2.8],[0,1],E.outCubic);

  return (
    <div style={{ width:W, height:H, background:C.bg, position:'relative', overflow:'hidden' }}>
      <Grid op={0.3}/>
      <Glow id="g1" cx="50%" cy="42%" r="55%" color={C.blue} op={0.08+0.05*g}/>
      <svg style={{ position:'absolute', inset:0, pointerEvents:'none' }} width={W} height={H}>
        <defs>
          <linearGradient id="aLine" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stopColor="transparent"/><stop offset="50%" stopColor={C.blue}/><stop offset="100%" stopColor="transparent"/>
          </linearGradient>
        </defs>
        <line x1={W*(1-hP)*0.5} y1={H-2} x2={W*(1-(1-hP)*0.5)} y2={H-2} stroke="url(#aLine)" strokeWidth={2}/>
      </svg>

      <div style={{ position:'absolute', inset:0, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center' }}>
        <div style={{ opacity:hP, transform:`translateY(${ip(t,[0.3,1.1],[20,0],E.outCubic)}px)`, fontSize:12, fontWeight:700, letterSpacing:'0.22em', color:C.blue, textTransform:'uppercase', marginBottom:20 }}>
          Unilever Internal · Team Orientation
        </div>
        <div style={{ opacity:hP, transform:`translateY(${ip(t,[0.3,1.1],[28,0],E.outCubic)}px)`, fontSize:108, fontWeight:900, color:C.text, lineHeight:1, letterSpacing:'-0.04em', textAlign:'center' }}>
          H3L
        </div>
        <div style={{ opacity:h2P, transform:`translateY(${ip(t,[0.8,1.6],[20,0],E.outCubic)}px)`, fontSize:108, fontWeight:900, lineHeight:1, letterSpacing:'-0.04em', textAlign:'center', background:'linear-gradient(135deg,#4F8EF7,#22D3A5)', WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent' }}>
          Design System Library
        </div>

        <div style={{ width:480*divP, height:1.5, background:'linear-gradient(90deg,transparent,#4F8EF7,#22D3A5,transparent)', margin:'28px 0' }}/>

        <div style={{ opacity:tagP, transform:`translateY(${ip(t,[1.5,2.2],[12,0],E.outCubic)}px)`, fontSize:22, fontWeight:400, color:C.muted, letterSpacing:'0.04em', textAlign:'center' }}>
          How to access it.&nbsp;&nbsp;&nbsp;How to use it.&nbsp;&nbsp;&nbsp;What's inside.
        </div>

        <div style={{ opacity:stP, display:'flex', gap:52, marginTop:52 }}>
          {[['224','Components'],['194','Live Previews'],['1 cmd','To Copy Any Component']].map(([n,l])=>(
            <div key={l} style={{ textAlign:'center' }}>
              <div style={{ fontSize:36, fontWeight:900, color:C.text }}>{n}</div>
              <div style={{ fontSize:12, color:C.muted, letterSpacing:'0.12em', textTransform:'uppercase', marginTop:5 }}>{l}</div>
            </div>
          ))}
        </div>
      </div>

      <div style={{ position:'absolute', bottom:28, right:40, opacity:stP, fontSize:12, color:C.dim, letterSpacing:'0.14em' }}>
        H3L Design System Library · 2025
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────
// SLIDE 2 — WHAT IS IT
// ─────────────────────────────────────────────────────────
function Slide2({ t }) {
  const hP = ip(t,[0.2,0.9],[0,1],E.outCubic);
  const categories = [
    { label:'Foundations',      desc:'Tokens, colors, typography, spacing', color:C.blue  },
    { label:'Primitives',       desc:'Button, Input, Badge, Icon, Chip',     color:C.teal  },
    { label:'Layout',           desc:'Grid, Stack, Container, Divider',      color:C.gold  },
    { label:'Navigation',       desc:'Nav, Sidebar, Breadcrumb, Tabs',       color:C.blue  },
    { label:'Forms & Data Entry',desc:'Select, DatePicker, Toggle, Checkbox',color:C.teal  },
    { label:'Data Display',     desc:'Table, Chart, Avatar, Progress',        color:C.gold  },
    { label:'Feedback',         desc:'Toast, Alert, Modal, Spinner',         color:C.blue  },
    { label:'Agent UI',         desc:'Chat, Command palette, AI panels',      color:C.teal  },
    { label:'Templates',        desc:'16 full workspace screens',            color:C.gold  },
  ];
  return (
    <div style={{ width:W, height:H, background:C.bg, position:'relative', overflow:'hidden' }}>
      <Glow id="g2" cx="80%" cy="20%" r="45%" color={C.teal} op={0.07}/>
      <div style={{ position:'absolute', inset:0, padding:'60px 96px' }}>
        <div style={{ opacity:hP }}><Label color={C.teal}>What's Inside</Label></div>
        <div style={{ opacity:hP, transform:`translateX(${ip(t,[0.2,0.9],[-24,0],E.outCubic)}px)`, fontSize:52, fontWeight:900, color:C.text, lineHeight:1.1, letterSpacing:'-0.025em', marginBottom:10 }}>
          One shared library.<br/><span style={{ color:C.teal }}>Everything your team needs.</span>
        </div>
        <div style={{ opacity:ip(t,[0.7,1.3],[0,1],E.outCubic), fontSize:16, color:C.muted, marginBottom:32 }}>
          224 components across 9 categories — all browsable, documented, and ready to copy into any project.
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:12 }}>
          {categories.map(({ label, desc, color }, i) => {
            const p = ip(t,[0.5+i*0.08,0.9+i*0.08],[0,1],E.outCubic);
            return (
              <div key={label} style={{ opacity:p, transform:`translateY(${ip(t,[0.5+i*0.08,0.9+i*0.08],[18,0],E.outCubic)}px)`, background:C.surf, border:`1px solid ${color}20`, borderLeft:`3px solid ${color}`, borderRadius:12, padding:'14px 18px' }}>
                <div style={{ fontSize:14, fontWeight:700, color:C.text, marginBottom:4 }}>{label}</div>
                <div style={{ fontSize:12.5, color:C.muted, lineHeight:1.5 }}>{desc}</div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────
// SLIDE 3 — HOW TO ACCESS
// ─────────────────────────────────────────────────────────
function Slide3({ t }) {
  const hP  = ip(t,[0.2,0.9],[0,1],E.outCubic);
  const u1P = ip(t,[0.7,1.3],[0,1],E.outCubic);
  const u2P = ip(t,[1.1,1.7],[0,1],E.outCubic);
  const u3P = ip(t,[1.5,2.1],[0,1],E.outCubic);
  const u4P = ip(t,[1.9,2.5],[0,1],E.outCubic);

  return (
    <div style={{ width:W, height:H, background:C.bg, position:'relative', overflow:'hidden' }}>
      <Glow id="g3" cx="15%" cy="70%" r="40%" color={C.blue} op={0.08}/>
      <div style={{ position:'absolute', inset:0, padding:'60px 96px' }}>
        <div style={{ opacity:hP }}><Label color={C.blue}>How to Access</Label></div>
        <div style={{ opacity:hP, transform:`translateX(${ip(t,[0.2,0.9],[-24,0],E.outCubic)}px)`, fontSize:52, fontWeight:900, color:C.text, lineHeight:1.1, letterSpacing:'-0.025em', marginBottom:48 }}>
          It's live.<br/><span style={{ color:C.blue }}>Open it in your browser.</span>
        </div>

        {/* Main URL */}
        <div style={{ opacity:u1P, transform:`scale(${0.95+0.05*u1P})`, background:C.surf, border:`1.5px solid ${C.blue}50`, borderRadius:16, padding:'26px 36px', display:'flex', alignItems:'center', gap:16, marginBottom:28 }}>
          <div style={{ width:12, height:12, borderRadius:'50%', background:C.teal, flexShrink:0 }}/>
          <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:22, color:C.blue, fontWeight:500 }}>
            gurneyk.github.io/Design-library
          </span>
          <div style={{ marginLeft:'auto', fontSize:12, color:C.dim, letterSpacing:'0.12em', textTransform:'uppercase' }}>Live · Public</div>
        </div>

        {/* Access methods */}
        <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
          {[
            { p:u2P, color:C.blue, icon:'⬡', title:'Browse the catalog',    body:'Land on the homepage — every component listed by category with a live preview.' },
            { p:u3P, color:C.teal, icon:'⌕', title:'Search for anything',   body:'Use the search bar to find a component by name, type, or keyword instantly.' },
            { p:u4P, color:C.gold, icon:'⧉', title:'View the manifest',     body:'developer-handoff.json and manifest.json are available at the root for programmatic access.' },
          ].map(({ p, color, icon, title, body }) => (
            <div key={title} style={{ opacity:p, transform:`translateX(${ip(t,[u1P?0.7:0,u1P?1.3:0],[-20,0],E.outCubic)}px)`, display:'flex', alignItems:'center', gap:18, background:C.surf, border:`1px solid ${color}20`, borderRadius:12, padding:'16px 24px' }}>
              <div style={{ fontSize:22, color, width:36, textAlign:'center', flexShrink:0 }}>{icon}</div>
              <div>
                <div style={{ fontSize:16, fontWeight:700, color:C.text, marginBottom:3 }}>{title}</div>
                <div style={{ fontSize:14, color:C.muted }}>{body}</div>
              </div>
            </div>
          ))}
        </div>

}

// ─────────────────────────────────────────────────────────
// SLIDE 4 — BROWSING THE CATALOG
// ─────────────────────────────────────────────────────────
function Slide4({ t }) {
  const hP = ip(t,[0.2,0.9],[0,1],E.outCubic);

  const mockComponents = [
    { name:'Button',      cat:'Primitives',  variants:'primary · secondary · ghost · danger',  tokens:'color.brand · spacing.2',     preview:'bg-blue' },
    { name:'DataTable',   cat:'Data Display', variants:'sortable · paginated · selectable',     tokens:'color.surface · radius.md',   preview:'bg-teal' },
    { name:'SideNav',     cat:'Navigation',   variants:'collapsed · expanded · rail',           tokens:'color.nav · spacing.4',       preview:'bg-gold' },
  ];

  return (
    <div style={{ width:W, height:H, background:C.bg, position:'relative', overflow:'hidden' }}>
      <Glow id="g4" cx="70%" cy="30%" r="45%" color={C.blue} op={0.07}/>
      <div style={{ position:'absolute', inset:0, padding:'60px 96px' }}>
        <div style={{ opacity:hP }}><Label color={C.blue}>Browsing the Catalog</Label></div>
        <div style={{ opacity:hP, transform:`translateX(${ip(t,[0.2,0.9],[-24,0],E.outCubic)}px)`, fontSize:48, fontWeight:900, color:C.text, lineHeight:1.1, letterSpacing:'-0.025em', marginBottom:10 }}>
          Every component tells you<br/><span style={{ color:C.blue }}>everything you need to know.</span>
        </div>
        <div style={{ opacity:ip(t,[0.6,1.2],[0,1],E.outCubic), fontSize:15.5, color:C.muted, marginBottom:32 }}>
          Each entry includes a live preview, props table, variant list, design token references, and copy instructions.
        </div>

        <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
          {mockComponents.map(({ name, cat, variants, tokens, preview }, i) => {
            const p = ip(t,[0.5+i*0.25,1.1+i*0.25],[0,1],E.outCubic);
            const colors = { 'bg-blue':C.blue, 'bg-teal':C.teal, 'bg-gold':C.gold };
            const col = colors[preview];
            return (
              <div key={name} style={{ opacity:p, transform:`translateY(${ip(t,[0.5+i*0.25,1.1+i*0.25],[20,0],E.outCubic)}px)`, background:C.surf, border:`1px solid ${C.border}`, borderRadius:14, padding:'18px 24px', display:'flex', alignItems:'center', gap:20 }}>
                {/* Mock preview box */}
                <div style={{ width:80, height:56, borderRadius:10, background:`${col}18`, border:`1px solid ${col}30`, flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center' }}>
                  <div style={{ width:40, height:16, borderRadius:4, background:col, opacity:0.7 }}/>
                </div>
                <div style={{ flex:1 }}>
                  <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:6 }}>
                    <span style={{ fontSize:17, fontWeight:800, color:C.text }}>{name}</span>
                    <span style={{ fontSize:11, color:col, background:`${col}18`, borderRadius:4, padding:'2px 8px', fontWeight:600, letterSpacing:'0.08em' }}>{cat}</span>
                  </div>
                  <div style={{ fontSize:13, color:C.muted, marginBottom:4 }}>Variants: <span style={{ color:C.text }}>{variants}</span></div>
                  <div style={{ fontSize:13, color:C.muted }}>Tokens: <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:12, color:col }}>{tokens}</span></div>
                </div>
                <div style={{ background:`${col}15`, border:`1px solid ${col}40`, borderRadius:8, padding:'8px 16px', fontSize:13, fontWeight:600, color:col, flexShrink:0 }}>
                  View →
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────
// SLIDE 5 — HOW TO COPY A COMPONENT
// ─────────────────────────────────────────────────────────
function Slide5({ t }) {
  const hP = ip(t,[0.2,0.9],[0,1],E.outCubic);
  return (
    <div style={{ width:W, height:H, background:C.bg, position:'relative', overflow:'hidden' }}>
      <Glow id="g5" cx="85%" cy="15%" r="40%" color={C.teal} op={0.07}/>
      <div style={{ position:'absolute', inset:0, padding:'60px 96px' }}>
        <div style={{ opacity:hP }}><Label color={C.teal}>Copying a Component</Label></div>
        <div style={{ opacity:hP, transform:`translateX(${ip(t,[0.2,0.9],[-24,0],E.outCubic)}px)`, fontSize:48, fontWeight:900, color:C.text, lineHeight:1.1, letterSpacing:'-0.025em', marginBottom:44 }}>
          Found what you need?<br/><span style={{ color:C.teal }}>One command gets it.</span>
        </div>

        <div style={{ display:'flex', flexDirection:'column', gap:18 }}>
          <StepRow n="1" color={C.blue} title="Find the component ID on the catalog page" t={t} delay={0.55}>
            <div style={{ fontSize:14.5, color:C.muted }}>Every component has a unique ID shown in its entry — e.g. <span style={{ fontFamily:"'JetBrains Mono',monospace", color:C.text, fontSize:13.5 }}>button</span>, <span style={{ fontFamily:"'JetBrains Mono',monospace", color:C.text, fontSize:13.5 }}>data-table</span>, <span style={{ fontFamily:"'JetBrains Mono',monospace", color:C.text, fontSize:13.5 }}>side-nav</span></div>
          </StepRow>

          <StepRow n="2" color={C.teal} title="Run the copy command from your project root" t={t} delay={0.95}>
            <div style={{ background:'#060B14', border:`1px solid ${C.dim}`, borderRadius:10, padding:'12px 18px', marginTop:4 }}>
              <div style={{ fontSize:13, color:C.dim, marginBottom:6, fontFamily:"'JetBrains Mono',monospace" }}># basic copy</div>
              <TypeLine text="npm run copy:component -- button" t={t} delay={1.1} style={{ fontSize:15.5, color:C.teal }}/>
              <br/><br/>
              <div style={{ fontSize:13, color:C.dim, marginBottom:6, fontFamily:"'JetBrains Mono',monospace" }}># with a receipt file showing what was copied</div>
              <TypeLine text="npm run copy:component -- button --receipt" t={t} delay={1.5} style={{ fontSize:15.5, color:C.teal }}/>
            </div>
          </StepRow>

          <StepRow n="3" color={C.gold} title="Use the component in your project" t={t} delay={1.95}>
            <div style={{ fontSize:14.5, color:C.muted }}>The component file, its dependencies, and Tailwind token setup land directly in your project. Import and use it immediately.</div>
          </StepRow>
        </div>

        <div style={{ opacity:ip(t,[2.4,3.0],[0,1],E.outCubic), marginTop:20, fontSize:13, color:C.dim, textAlign:'right' }}>
          Works on PowerShell · Bash · Windows · macOS · Linux
        </div>
      </div>
    </div>

}

// ─────────────────────────────────────────────────────────
// SLIDE 6 — WHAT YOU GET
// ─────────────────────────────────────────────────────────
function Slide6({ t }) {
  const hP = ip(t,[0.2,0.9],[0,1],E.outCubic);
  const files = [
    { name:'Button.tsx',              desc:'The component source — typed, variant-aware, ready to use',  color:C.blue },
    { name:'Button.stories.tsx',      desc:'Storybook stories for local preview and testing',             color:C.teal },
    { name:'tailwind.tokens.css',     desc:'All design tokens this component depends on',                color:C.gold },
    { name:'RECEIPT.md',              desc:'What was copied, why, and how to update it later',            color:C.blue },
  ];
  return (

// ─────────────────────────────────────────────────────────
// SLIDE REGISTRY
// ─────────────────────────────────────────────────────────
const SLIDES = [Slide1,Slide2,Slide3,Slide4,Slide5,Slide6,Slide7,Slide8,Slide9,Slide10];

// ─────────────────────────────────────────────────────────
// APP
// ─────────────────────────────────────────────────────────
function App() {
  const [active, setActive]         = useState(0);
  const [prev, setPrev]             = useState(null);
  const [transP, setTransP]         = useState(1);
  const [slideT, setSlideT]         = useState(0);
  const [showUI, setShowUI]         = useState(true);
  const [fullscreen, setFullscreen] = useState(false);
  const [auto, setAuto]             = useState(false);

  const raf           = useRef(null);
  const lastTs        = useRef(null);
  const transRef      = useRef(1);
  const slideTR       = useRef(0);
  const activeR       = useRef(0);
  const autoR         = useRef(false);
  const transitioning = useRef(false);
  const uiTimer       = useRef(null);

  const AUTO_SECS = 10;

  useEffect(() => {
    const loop = ts => {
      const dt = lastTs.current ? Math.min((ts - lastTs.current)/1000, 0.1) : 0;
      lastTs.current = ts;

      if (transRef.current < 1) {
        transRef.current = Math.min(1, transRef.current + dt/TRANS_DUR);
        setTransP(transRef.current);
        if (transRef.current >= 1) { setPrev(null); transitioning.current = false; }
      }

      slideTR.current += dt;
      setSlideT(slideTR.current);

      if (autoR.current && slideTR.current > AUTO_SECS && !transitioning.current) {
        if (activeR.current < SLIDE_COUNT - 1) go(activeR.current + 1);
        else { autoR.current = false; setAuto(false); }
      }

      raf.current = requestAnimationFrame(loop);
    };
    raf.current = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf.current);
  }, []);

  const go = useCallback(idx => {
    if (transitioning.current || idx < 0 || idx >= SLIDE_COUNT) return;
    transitioning.current = true;
    setPrev(activeR.current);
    activeR.current = idx;
    setActive(idx);
    transRef.current = 0;
    setTransP(0);
    slideTR.current = 0;
    setSlideT(0);
  }, []);

  useEffect(() => {
    const k = e => {
      if (e.key==='ArrowRight'||e.key===' '||e.key==='ArrowDown') { e.preventDefault(); go(activeR.current+1); }
      else if (e.key==='ArrowLeft'||e.key==='ArrowUp') { e.preventDefault(); go(activeR.current-1); }
      else if (e.key==='f'||e.key==='F') toggleFS();
      else if (e.key==='a'||e.key==='A') toggleAuto();
    };
    window.addEventListener('keydown', k);
    return () => window.removeEventListener('keydown', k);
  }, [go]);

  const toggleFS = useCallback(() => {
    if (!document.fullscreenElement) { document.documentElement.requestFullscreen?.(); setFullscreen(true); }
    else { document.exitFullscreen?.(); setFullscreen(false); }
  }, []);

  const toggleAuto = useCallback(() => {
    const n = !autoR.current;
    autoR.current = n;
    setAuto(n);
  }, []);

  useEffect(() => {
    const mv = () => {
      setShowUI(true);
      clearTimeout(uiTimer.current);
      uiTimer.current = setTimeout(() => setShowUI(false), 3200);
    };
    window.addEventListener('mousemove', mv);
    return () => window.removeEventListener('mousemove', mv);
  }, []);

  const entering = E.inOutCubic(c01(transP));
  const exiting  = 1 - entering;
  const ActiveComp = SLIDES[active];
  const PrevComp   = prev !== null ? SLIDES[prev] : null;

  return (
    <Stage>
      {PrevComp && (
        <div style={{ position:'absolute', inset:0, opacity:exiting, transform:`scale(${1-exiting*0.04})`, pointerEvents:'none' }}>
          <PrevComp t={slideTR.current}/>
        </div>
      )}
      <div style={{ position:'absolute', inset:0, opacity:entering, transform:`scale(${0.97+entering*0.03})` }}>
        <ActiveComp t={slideT}/>
      </div>

      {/* Dot nav */}
      <div style={{ position:'absolute', bottom:22, left:'50%', transform:'translateX(-50%)', display:'flex', gap:8, alignItems:'center', opacity:showUI?1:0, transition:'opacity 0.35s', zIndex:100 }}>
        {Array.from({length:SLIDE_COUNT},(_,i)=>(
          <div key={i} onClick={()=>go(i)} style={{ width:i===active?26:8, height:8, borderRadius:4, background:i===active?C.blue:C.dim, cursor:'pointer', transition:'all 0.3s' }}/>
        ))}
      </div>

      {/* Controls */}
      <div style={{ position:'absolute', bottom:18, right:22, display:'flex', gap:8, alignItems:'center', opacity:showUI?1:0, transition:'opacity 0.35s', zIndex:100 }}>
        <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:12, color:C.dim }}>{active+1}/{SLIDE_COUNT}</span>
        <button onClick={toggleAuto} style={{ background:auto?`${C.blue}18`:'transparent', border:`1px solid ${auto?C.blue:C.dim}`, borderRadius:7, padding:'5px 11px', cursor:'pointer', color:auto?C.blue:C.dim, fontSize:12 }}>
          {auto?'⏸ Auto':'▶ Auto'}
        </button>
        <button onClick={toggleFS} style={{ background:'transparent', border:`1px solid ${C.dim}`, borderRadius:7, padding:'5px 11px', cursor:'pointer', color:C.dim, fontSize:12 }}>
          {fullscreen?'⛶ Exit':'⛶'}
        </button>
      </div>

      {/* Arrows */}
      {active>0 && (
        <div style={{ position:'absolute', left:14, top:'50%', transform:'translateY(-50%)', opacity:showUI?1:0, transition:'opacity 0.35s', zIndex:100 }}>
          <button onClick={()=>go(active-1)} style={{ background:`${C.surf}CC`, border:`1px solid ${C.border}`, borderRadius:'50%', width:42, height:42, cursor:'pointer', color:C.text, fontSize:20, display:'flex', alignItems:'center', justifyContent:'center' }}>‹</button>
        </div>
      )}
      {active<SLIDE_COUNT-1 && (
        <div style={{ position:'absolute', right:14, top:'50%', transform:'translateY(-50%)', opacity:showUI?1:0, transition:'opacity 0.35s', zIndex:100 }}>
          <button onClick={()=>go(active+1)} style={{ background:`${C.surf}CC`, border:`1px solid ${C.border}`, borderRadius:'50%', width:42, height:42, cursor:'pointer', color:C.text, fontSize:20, display:'flex', alignItems:'center', justifyContent:'center' }}>›</button>
        </div>
      )}

      {/* Hint on slide 1 */}
      {active===0 && slideT>3.5 && (
        <div style={{ position:'absolute', bottom:58, left:'50%', transform:'translateX(-50%)', opacity:Math.min(1,(slideT-3.5)/0.5)*(showUI?1:0.4), fontSize:12, color:C.dim, letterSpacing:'0.16em', display:'flex', gap:14, zIndex:100 }}>
          <span>← → Navigate</span><span>·</span><span>F Fullscreen</span><span>·</span><span>A Auto-play</span>
        </div>
      )}
    </Stage>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
